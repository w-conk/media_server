# Nginx Proxy Manager - run as its own stack (e.g. in Portainer).
# Admin UI: http://<host-ip>:81  (default login: admin@example.com / changeme)

services:
  app:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    environment:
      TZ: America/Chicago
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - npm-data:/data
      - npm-letsencrypt:/etc/letsencrypt

volumes:
  npm-data:
  npm-letsencrypt:
