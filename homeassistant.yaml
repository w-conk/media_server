# Home Assistant Docker Compose configuration
services:
  homeassistant:
    image: lscr.io/linuxserver/homeassistant:latest
    container_name: homeassistant
    restart: unless-stopped
    environment:
      - TZ=America/Chicago
    volumes:
      - /data/compose/5/config/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
    network_mode: host
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
